<body>

  <h1>CYBER SEARCH</h1>

  <div class="description">
    點擊數字進行猜測，視覺化體驗 Binary Search 的縮圈演算法
  </div>

  <div class="panel">

    <div class="hud">
      <div class="hud-card">
        <div class="hud-label">ATTEMPTS</div>
        <div class="hud-value" id="attempts">0</div>
      </div>

      <div class="hud-card">
        <div class="hud-label">SEARCH RANGE</div>
        <div class="hud-value" id="rangeDisplay">1 ~ 100</div>
      </div>
    </div>

    <div id="message"></div>

    <div id="rangeInfo">
      SYSTEM READY
    </div>

    <div class="grid" id="numberGrid"></div>

    <div class="controls">
      <button id="restartBtn">RESTART SYSTEM</button>
    </div>

  </div>

  <script>
    const grid = document.getElementById("numberGrid");
    const message = document.getElementById("message");
    const rangeInfo = document.getElementById("rangeInfo");
    const restartBtn = document.getElementById("restartBtn");
    const attemptsText = document.getElementById("attempts");
    const rangeDisplay = document.getElementById("rangeDisplay");

    let target;
    let attempts;
    let low;
    let high;
    let gameOver;

    function createGrid() {

      grid.innerHTML = "";

      for (let i = 1; i <= 100; i++) {

        const cell = document.createElement("div");

        cell.className = "number";
        cell.id = `num-${i}`;
        cell.textContent = i;

        cell.addEventListener("click", () => {
          handleGuess(i);
        });

        grid.appendChild(cell);
      }
    }

    function initGame() {

      target = Math.floor(Math.random() * 100) + 1;

      attempts = 0;
      low = 1;
      high = 100;
      gameOver = false;

      attemptsText.textContent = attempts;
      rangeDisplay.textContent = `${low} ~ ${high}`;

      message.textContent = "";
      rangeInfo.textContent = "SYSTEM READY";

      document.querySelectorAll(".number").forEach(cell => {
        cell.className = "number";
      });
    }

    function updateVisualization(currentGuess = null, isCorrect = false) {

      for (let i = 1; i <= 100; i++) {

        const cell = document.getElementById(`num-${i}`);

        cell.classList.remove("active", "correct", "eliminated");

        if (i < low || i > high) {
          cell.classList.add("eliminated");
        }

        if (i === currentGuess && !isCorrect) {
          cell.classList.add("active");
        }

        if (i === currentGuess && isCorrect) {
          cell.classList.add("correct");
        }
      }

      rangeDisplay.textContent = `${low} ~ ${high}`;
    }

    function handleGuess(guess) {

      if (gameOver) return;

      if (guess < low || guess > high) return;

      attempts++;
      attemptsText.textContent = attempts;

      if (guess < target) {

        message.textContent = "TARGET HIGHER";
        message.style.color = "#ffb84d";

        rangeInfo.textContent =
          `ELIMINATING ${low} ~ ${guess}`;

        low = guess + 1;

        updateVisualization(guess);

      }
      else if (guess > target) {

        message.textContent = "TARGET LOWER";
        message.style.color = "#ff6b6b";

        rangeInfo.textContent =
          `ELIMINATING ${guess} ~ ${high}`;

        high = guess - 1;

        updateVisualization(guess);

      }
      else {

        gameOver = true;

        message.textContent = "BINGO! TARGET ACQUIRED";
        message.style.color = "#00ff9d";

        rangeInfo.textContent =
          `MISSION COMPLETE IN ${attempts} ATTEMPTS`;

        updateVisualization(guess, true);
      }
    }

    restartBtn.addEventListener("click", initGame);

    createGrid();
    initGame();

  </script>

</body>
</html>
